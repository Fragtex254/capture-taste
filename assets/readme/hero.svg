<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Capture Taste</title>
  <desc id="desc">Capture transferable design judgment from a reference URL, turn it into an evidence-backed Taste Pack, and give different AI agents one consistent design authority.</desc>

  <rect width="1200" height="420" rx="28" fill="#F4F1E8"/>
  <path d="M0 72H1200" stroke="#171613" stroke-opacity="0.16"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#656159">
    <text x="56" y="44">AI DESIGN GOVERNANCE SKILL</text>
    <text x="1045" y="44">v1.0.1</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" fill="#171613">
    <text x="56" y="163" font-size="82" font-weight="800" letter-spacing="-4">CAPTURE</text>
    <text x="56" y="246" font-size="82" font-weight="800" letter-spacing="-4">TASTE</text>
    <text x="59" y="302" font-size="25" font-weight="600">捕获可迁移的设计判断，而不是复刻页面。</text>
    <text x="59" y="338" font-size="21" fill="#656159">URL → evidence → rules → project authority → consistent UI</text>
  </g>

  <g transform="translate(735 94)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect x="0" y="0" width="409" height="64" rx="12" fill="#FFFDF8" stroke="#171613" stroke-width="2"/>
    <circle cx="30" cy="32" r="8" fill="#EB684A"/>
    <text x="54" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#656159">REFERENCE URL</text>
    <text x="54" y="49" font-size="20" font-weight="700" fill="#171613">Observe with explicit trust</text>

    <path d="M204 64V88" stroke="#171613" stroke-width="2"/>
    <path d="M196 80L204 88L212 80" fill="none" stroke="#171613" stroke-width="2"/>

    <rect x="0" y="88" width="409" height="118" rx="12" fill="#171613"/>
    <text x="24" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#A9A59C">TASTE PACK</text>
    <text x="24" y="151" font-size="23" font-weight="700" fill="#FFFFFF">Evidence-backed rules</text>
    <text x="24" y="181" font-size="18" fill="#D7D3CA">rules · restraint · typography · motion</text>
    <rect x="325" y="108" width="12" height="78" rx="6" fill="#2D5BFF"/>
    <rect x="343" y="108" width="12" height="78" rx="6" fill="#B8FF00"/>
    <rect x="361" y="108" width="12" height="78" rx="6" fill="#F2C94C"/>
    <rect x="379" y="108" width="12" height="78" rx="6" fill="#EB684A"/>

    <path d="M204 206V230" stroke="#171613" stroke-width="2"/>
    <path d="M196 222L204 230L212 222" fill="none" stroke="#171613" stroke-width="2"/>

    <rect x="0" y="230" width="409" height="64" rx="12" fill="#FFFDF8" stroke="#171613" stroke-width="2"/>
    <text x="24" y="257" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#656159">ANY AGENT · ONE AUTHORITY</text>
    <text x="24" y="281" font-size="20" font-weight="700" fill="#171613">Create, retrofit, score, review</text>
  </g>
</svg>
